# Checks a pull request that changes the release feed.
#
# releases.json is written by the release workflows of the Unity plugin, the Unreal
# plugin, and Director, each of which opens a feed pull request here. Before merging,
# the owner regenerates releases.md and signs the feed (tools/sign-feed.md). This
# workflow checks that both happened:
#
#   1. releases.json matches tools/schema/releases-feed.schema.json, a byte-exact copy
#      of contracts/director/v1/releases-feed.schema.json in the architecture repository.
#   2. releases.json.minisig sits beside a feed that lists a release. An empty feed
#      needs no signature. The signature itself is checked by the plugins, which hold
#      the public key; this job only checks that it is there.
#   3. releases.md is exactly what tools/render_releases_md.py makes from releases.json.

name: Releases page

on:
  pull_request:
    paths:
      - releases.json
      - releases.json.minisig
      - releases.md
      - tools/**
      - .github/workflows/releases-page.yml

permissions:
  contents: read

concurrency:
  group: releases-page-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the feed and the page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install --disable-pip-version-check "jsonschema[format-nongpl]==4.23.0"

      - name: Validate releases.json against the schema
        shell: python
        run: |
          import json
          import sys

          import jsonschema

          with open("tools/schema/releases-feed.schema.json", encoding="utf-8") as stream:
              schema = json.load(stream)
          with open("releases.json", encoding="utf-8") as stream:
              feed = json.load(stream)
          validator_class = jsonschema.validators.validator_for(schema)
          validator_class.check_schema(schema)
          validator = validator_class(schema, format_checker=validator_class.FORMAT_CHECKER)
          errors = sorted(validator.iter_errors(feed), key=lambda e: list(e.absolute_path))
          for error in errors:
              where = "/".join(str(p) for p in error.absolute_path) or "(root)"
              print(f"::error file=releases.json::{where}: {error.message}")
          if errors:
              sys.exit(1)
          print("releases.json matches releases-feed.schema.json.")

      - name: Check the feed signature is present
        shell: python
        run: |
          import json
          import pathlib
          import sys

          feed = json.loads(pathlib.Path("releases.json").read_text(encoding="utf-8"))
          signature = pathlib.Path("releases.json.minisig")
          empty = not feed["line"] and not feed["artifacts"] and not feed["previous"]
          if empty:
              print("The feed lists no release; a signature is optional.")
              sys.exit(0)
          if not signature.is_file() or signature.stat().st_size == 0:
              print(
                  "::error file=releases.json::releases.json lists a release but releases.json.minisig "
                  "is missing or empty. Sign the feed on this branch before merging (tools/sign-feed.md)."
              )
              sys.exit(1)
          first = signature.read_text(encoding="utf-8", errors="replace").splitlines()[0]
          if not first.startswith("untrusted comment:"):
              print(
                  "::error file=releases.json.minisig::releases.json.minisig does not look like a "
                  "minisign signature (its first line is not an untrusted comment)."
              )
              sys.exit(1)
          print("releases.json.minisig is present.")

      - name: Check releases.md is regenerated
        run: python tools/render_releases_md.py --check

      - name: Run the page generator's tests
        run: python -m unittest discover -s tools
